name: CI Load Test Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Runner Info
        run: |
          echo "Running on: $(uname -a)"
          docker --version
          kubectl version --client || true

